[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codegrapher-mcp"
version = "0.1.0"
description = "MCP server exposing CodeGrapher's static codebase analysis tools — pure analysis, no LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "CodeGrapher" }]
keywords = ["mcp", "static-analysis", "tree-sitter", "code-graph", "leiden"]

dependencies = [
    # MCP SDK
    "mcp>=1.0.0",

    # Graph analysis
    "networkx>=3.0",

    # PDF report generation
    "reportlab>=4.0.0",
    # Playwright is used to rasterize Mermaid diagrams to PNG for embedding.
    # The browser still needs a one-time install: `playwright install chromium`
    "playwright>=1.40.0",

    # Tree-sitter AST extraction
    "tree-sitter>=0.21.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.21.0",
    "tree-sitter-typescript>=0.21.0",
    "tree-sitter-go>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "tree-sitter-java>=0.21.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-cpp>=0.21.0",
    "tree-sitter-c-sharp>=0.21.0",
    "tree-sitter-ruby>=0.21.0",
    "tree-sitter-kotlin>=0.21.0",
]

[project.optional-dependencies]
# Better community detection — falls back to networkx Louvain if absent
leiden = ["graspologic>=3.0.0"]

# AWS Transform integration — fetch output from s3:// paths
aws = ["boto3>=1.26.0"]

# Office file ingestion (docx/xlsx/pdf classification in detect.py).
# Only needed if you want detect_files to read content from those formats.
office = [
    "python-docx>=1.0.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
]

dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.scripts]
codegrapher-mcp = "codegrapher_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["codegrapher_mcp*"]
